<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
	--bg: #f4f5f8;
	--surface: #ffffff;
	--surface-2: #eceef3;
	--ink: #1a1e27;
	--muted: #586072;
	--line: #d9dde5;
	--accent: #3b4cc0;
	--accent-ink: #ffffff;
	--match: #1c7a47;
	--match-bg: #e2f3e9;
	--minor: #8f5d00;
	--minor-bg: #fbeed2;
	--off: #b3261e;
	--off-bg: #fbe3e1;
	--none: #586072;
	--none-bg: #eceef3;
	--checker-a: #ffffff;
	--checker-b: #e3e6ec;
	--shadow: 0 1px 2px rgba(20, 24, 40, 0.06), 0 4px 16px rgba(20, 24, 40, 0.05);
	--sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
	--display: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
	--mono: "IBM Plex Mono", Consolas, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #12151c;
		--surface: #191d26;
		--surface-2: #222733;
		--ink: #e5e8ef;
		--muted: #9aa3b4;
		--line: #2d3442;
		--accent: #9aa6ff;
		--accent-ink: #12151c;
		--match: #6fd29a;
		--match-bg: #173325;
		--minor: #f0bb55;
		--minor-bg: #3a2c10;
		--off: #ff8a80;
		--off-bg: #43201e;
		--none: #9aa3b4;
		--none-bg: #242a36;
		--checker-a: #2a303c;
		--checker-b: #232834;
		--shadow: none;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #12151c;
	--surface: #191d26;
	--surface-2: #222733;
	--ink: #e5e8ef;
	--muted: #9aa3b4;
	--line: #2d3442;
	--accent: #9aa6ff;
	--accent-ink: #12151c;
	--match: #6fd29a;
	--match-bg: #173325;
	--minor: #f0bb55;
	--minor-bg: #3a2c10;
	--off: #ff8a80;
	--off-bg: #43201e;
	--none: #9aa3b4;
	--none-bg: #242a36;
	--checker-a: #2a303c;
	--checker-b: #232834;
	--shadow: none;
	color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
	margin: 0;
	background: var(--bg);
	color: var(--ink);
	font: 15px/1.6 var(--sans);
	padding-inline: 16px;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code { font: 0.88em var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
pre { font: 13px/1.55 var(--mono); background: var(--surface-2); padding: 12px 14px; border-radius: 6px; overflow-x: auto; margin: 0 0 14px; }
pre code { background: none; padding: 0; }

.page { max-width: 1240px; margin: 0 auto; padding-block: 40px 96px; }
header.top { display: grid; gap: 10px; padding-bottom: 28px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.eyebrow { font: 500 12px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font: 600 clamp(28px, 4vw, 40px)/1.12 var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.lead { max-width: 68ch; color: var(--muted); margin: 0; font-size: 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; font-family: var(--mono); font-size: 12.5px; }
.theme-toggle { justify-self: start; font: 500 12px var(--sans); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }

nav.toc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin-bottom: 40px; box-shadow: var(--shadow); }
nav.toc h2 { font: 600 13px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; border: 0; padding: 0; }
nav.toc ol { list-style: none; margin: 0; padding: 0; columns: 2 300px; column-gap: 32px; }
nav.toc li { break-inside: avoid; }
nav.toc li.l1 { font-weight: 600; margin-top: 8px; }
nav.toc li.l2 { padding-left: 26px; font-size: 14px; }
nav.toc li.l3 { padding-left: 56px; font-size: 13px; }
nav.toc li.l3 a { padding: 0; color: var(--muted); }
nav.toc a { color: var(--ink); text-decoration: none; display: block; padding: 2px 0; }
nav.toc a:hover { color: var(--accent); }
.num { font-family: var(--mono); font-weight: 500; color: var(--muted); font-size: 0.8em; margin-right: 6px; }

h2 { font: 600 28px/1.2 var(--display); margin: 64px 0 14px; padding-top: 18px; border-top: 2px solid var(--ink); text-wrap: balance; scroll-margin-top: 16px; }
h3 { font: 600 21px/1.25 var(--display); margin: 40px 0 10px; text-wrap: balance; scroll-margin-top: 16px; }
h4 { font: 600 17px/1.3 var(--display); margin: 34px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: 16px; }
p { max-width: 76ch; margin: 0 0 14px; }
.meta { font-size: 13px; color: var(--muted); }
.callout { border-left: 3px solid var(--minor); background: var(--minor-bg); padding: 8px 12px; border-radius: 0 6px 6px 0; }
.legend { font-size: 13px; color: var(--muted); }
ul.reading { max-width: 80ch; padding-left: 20px; display: grid; gap: 8px; margin: 0 0 16px; }
ul.reading b { font-weight: 600; }
.dim { color: var(--muted); }
.table-title { font: 600 13px/1.4 var(--sans); color: var(--muted); margin: 18px 0 6px; max-width: none; }
.note { font-size: 13px; color: var(--muted); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; box-shadow: var(--shadow); }
.table-wrap.tall { max-height: 460px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; font-weight: 600; vertical-align: bottom; line-height: 1.3; }
thead th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
thead th button::after { content: "\2195"; font-size: 11px; color: var(--muted); opacity: 0.6; }
thead th[aria-sort="ascending"] button::after { content: "\2191"; opacity: 1; color: var(--accent); }
thead th[aria-sort="descending"] button::after { content: "\2193"; opacity: 1; color: var(--accent); }
td.n { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
td.n.ok { color: var(--match); }
td.n.warn { color: var(--minor); }
td.n.bad { color: var(--off); font-weight: 500; }
td.group { white-space: nowrap; color: var(--muted); font-size: 12.5px; }
.ref-note { display: grid; align-content: center; padding: 8px 10px; font-size: 13px; color: var(--muted); }
.ref-note p { margin: 0; }
.ref-note b { color: var(--ink); font-weight: 600; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.mode { font: 500 12px var(--mono); letter-spacing: 0.04em; }
table.summary td:nth-child(2) { white-space: nowrap; }

.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 500 12px/1.6 var(--mono); white-space: nowrap; }
.chip.match { color: var(--match); background: var(--match-bg); }
.chip.minor { color: var(--minor); background: var(--minor-bg); }
.chip.off { color: var(--off); background: var(--off-bg); }
.chip.none { color: var(--none); background: var(--none-bg); }
.chip a { color: inherit; text-decoration: none; }
a.known { font: 500 11px var(--mono); color: var(--minor); margin-left: 6px; text-decoration: none; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }

.gallery { display: grid; gap: 14px; margin: 10px 0 20px; }
.gallery.narrow { grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
.gallery.wide { grid-template-columns: 1fr; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-shadow: var(--shadow); }
.gallery.wide .pair { grid-template-columns: 1fr; }
figure { margin: 0; display: grid; gap: 4px; align-content: start; }
figure img, table.shots img { display: block; width: 100%; height: auto; max-width: 100%; image-rendering: pixelated; background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 12px 12px; border-radius: 3px; }
figcaption { font-size: 12.5px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 2px 8px; justify-content: space-between; }
figcaption .detail { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
a.zoom { display: block; cursor: zoom-in; }
table.shots { min-width: 640px; }
table.shots td { width: 31%; padding: 6px; vertical-align: top; }

details.develop { margin: 4px 0 24px; border: 1px dashed var(--line); border-radius: 8px; background: var(--surface-2); }
details.develop > summary { cursor: pointer; list-style: none; padding: 8px 14px; font: 500 13px var(--sans); color: var(--muted); display: flex; align-items: center; gap: 8px; }
details.develop > summary::-webkit-details-marker { display: none; }
details.develop > summary::before { content: "\25B8"; font-size: 11px; transition: transform 0.15s; }
details.develop[open] > summary::before { transform: rotate(90deg); }
details.develop > summary:hover { color: var(--ink); }
details.develop .hide, details.develop[open] .show { display: none; }
details.develop[open] .hide { display: inline; }
.develop-body { padding: 0 14px 6px; }
.develop-note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
@media (prefers-reduced-motion: reduce) { details.develop > summary::before { transition: none; } }
@media print { details.develop { display: none; } }
table.shots td .shot-pct { display: block; margin-top: 4px; font: 12px var(--mono); color: var(--muted); }
table.shots th[scope="row"] { width: 90px; }

.viewer { position: fixed; inset: 0; background: rgba(8, 10, 16, 0.92); display: none; z-index: 10; }
.viewer.open { display: grid; grid-template-rows: auto 1fr; }
.viewer .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; color: #e5e8ef; font-size: 13px; }
.viewer .bar .title { flex: 1 1 280px; }
.viewer .bar button { font: 500 12px var(--sans); color: #e5e8ef; background: #262c38; border: 1px solid #3a4252; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.viewer .stage { overflow: auto; display: grid; place-items: center; padding: 16px; }
.viewer img { image-rendering: pixelated; background: repeating-conic-gradient(#2a303c 0 25%, #232834 0 50%) 0 0 / 12px 12px; }
.viewer.fit img { max-width: 100%; max-height: calc(100vh - 90px); }

@media (max-width: 640px) {
	body { font-size: 14.5px; }
	h2 { font-size: 24px; }
	nav.toc li.l2 { padding-left: 14px; }
	nav.toc li.l3 { padding-left: 28px; }
}
@media print {
	.theme-toggle, .viewer { display: none !important; }
	.table-wrap.tall { max-height: none; }
}
</style>
</head>
<body>
<div class="page">
<header class="top">
	<p class="eyebrow">{{EYEBROW}}</p>
	<h1>{{TITLE}}</h1>
	<p class="lead">{{LEAD}}</p>
	<ul class="facts">
{{FACTS}}
	</ul>
	<button class="theme-toggle" type="button" id="theme">Theme: system</button>
</header>
<nav class="toc" aria-label="Contents">
	<h2>Contents</h2>
	<ol>
{{TOC}}
	</ol>
</nav>
<main>
{{BODY}}
</main>
</div>
<div class="viewer fit" id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer">
	<div class="bar">
		<span class="title" id="viewer-title"></span>
		<span id="viewer-count"></span>
		<button type="button" id="viewer-prev">&larr; Previous</button>
		<button type="button" id="viewer-next">Next &rarr;</button>
		<button type="button" id="viewer-fit">Actual size</button>
		<button type="button" id="viewer-close">Close</button>
	</div>
	<div class="stage" id="viewer-stage"><img id="viewer-img" alt=""></div>
</div>
<script>
(function () {
	// theme: system, light, dark
	var root = document.documentElement, button = document.getElementById("theme"), states = ["system", "light", "dark"], state = 0;
	if (button) {
	try { state = Math.max(0, states.indexOf(localStorage.getItem("report-theme") || "system")); } catch (e) {}
	function applyTheme() {
		if (states[state] === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", states[state]);
		button.textContent = "Theme: " + states[state];
	}
	button.addEventListener("click", function () {
		state = (state + 1) % states.length;
		try { localStorage.setItem("report-theme", states[state]); } catch (e) {}
		applyTheme();
	});
	applyTheme();
	}

	// sortable tables: numbers by data-v, text otherwise
	document.querySelectorAll("table.sortable").forEach(function (table) {
		var headers = table.querySelectorAll("thead th");
		headers.forEach(function (th, column) {
			th.querySelector("button").addEventListener("click", function () {
				var ascending = th.getAttribute("aria-sort") !== "ascending";
				headers.forEach(function (h) { h.removeAttribute("aria-sort"); });
				th.setAttribute("aria-sort", ascending ? "ascending" : "descending");
				var body = table.tBodies[0], rows = Array.prototype.slice.call(body.rows);
				function key(row) {
					var cell = row.cells[column];
					if (!cell) return "";
					var v = cell.getAttribute("data-v");
					if (v !== null && v !== "" && !isNaN(parseFloat(v)) && isFinite(v)) return parseFloat(v);
					return (v !== null ? v : cell.textContent).trim().toLowerCase();
				}
				rows.sort(function (a, b) {
					var x = key(a), y = key(b);
					if (typeof x === "number" && typeof y === "number") return ascending ? x - y : y - x;
					if (typeof x === "number") return -1;
					if (typeof y === "number") return 1;
					var c = x.localeCompare(y, undefined, { numeric: true });
					return ascending ? c : -c;
				});
				rows.forEach(function (row) { body.appendChild(row); });
			});
		});
	});

	// image viewer: click an image, arrows move within its group, Esc closes
	var viewer = document.getElementById("viewer"), img = document.getElementById("viewer-img");
	var title = document.getElementById("viewer-title"), count = document.getElementById("viewer-count");
	var fit = document.getElementById("viewer-fit"), links = [], index = 0, opener = null;
	function show(i) {
		index = (i + links.length) % links.length;
		var link = links[index], inner = link.querySelector("img");
		img.src = inner ? (inner.currentSrc || inner.src) : link.getAttribute("href");
		img.alt = inner ? inner.alt : "";
		var figure = link.closest("figure");
		title.textContent = link.getAttribute("title") || (figure ? figure.querySelector("figcaption").textContent : img.alt);
		count.textContent = (index + 1) + " / " + links.length;
	}
	document.addEventListener("click", function (event) {
		var link = event.target.closest("a.zoom");
		if (!link) return;
		event.preventDefault();
		var group = link.getAttribute("data-gallery");
		links = Array.prototype.slice.call(document.querySelectorAll('a.zoom[data-gallery="' + group + '"]'));
		opener = link;
		viewer.classList.add("open");
		show(links.indexOf(link));
		document.getElementById("viewer-close").focus();
	});
	function close() { viewer.classList.remove("open"); if (opener) opener.focus(); }
	document.getElementById("viewer-close").addEventListener("click", close);
	document.getElementById("viewer-prev").addEventListener("click", function () { show(index - 1); });
	document.getElementById("viewer-next").addEventListener("click", function () { show(index + 1); });
	fit.addEventListener("click", function () {
		var fitted = viewer.classList.toggle("fit");
		fit.textContent = fitted ? "Actual size" : "Fit to window";
	});
	document.getElementById("viewer-stage").addEventListener("click", function (event) { if (event.target === this) close(); });
	document.addEventListener("keydown", function (event) {
		if (!viewer.classList.contains("open")) return;
		if (event.key === "Escape") close();
		else if (event.key === "ArrowLeft") show(index - 1);
		else if (event.key === "ArrowRight") show(index + 1);
	});

	// anchors: scroll within the page even where a viewer treats links as navigation
	document.addEventListener("click", function (event) {
		var link = event.target.closest('a[href^="#"]');
		if (!link) return;
		var target = document.getElementById(link.getAttribute("href").slice(1));
		if (!target) return;
		event.preventDefault();
		target.scrollIntoView();
		try { history.replaceState(null, "", link.getAttribute("href")); } catch (e) {}
	});
})();
</script>
</body>
</html>
